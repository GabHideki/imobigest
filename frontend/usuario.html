<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/tabelas.css">
</head>

<body>
    
    <main>

        <aside class="menu" id="menu">

            <div class="topo-menu">
                <button id="btn-menu" class="btn-menu" type="button" aria-label="Abrir ou fechar menu">
                    <i class="bi bi-list"></i>
                </button>
            </div>

            <nav>

                <ul>

                    <li>
                        <a href="/usuario.html">
                            <i class="bi bi-people"></i>
                            <span>Usuarios</span>
                        </a>
                    </li>

                    <li>
                        <a href="/imovel.html">
                            <i class="bi bi-house-door"></i>
                            <span>Imóveis</span>
                        </a>
                    </li>

                    <li>
                        <a href="/contrato.html">
                            <i class="bi bi-file-earmark-text"></i>
                            <span>Contratos</span>
                        </a>
                    </li>

                </ul>

            </nav>  

            <div class="menu-footer">
                <button id="btn-sair" class="btn-sair" type="button">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Sair</span>
                </button>
            </div>
        </aside>

        <section class="conteudo">
            <h1>Usuarios</h1>

            <div class="tabela">
                <div class="container-busca">
                    <div class="grupo-busca">
                        <div class="busca">
                            <input id="buscar" class="input-busca" type="text" placeholder="Buscar usuario...">
                        </div>

                        <div class="filtro">
                            <select id="filtro" class="select-filtro">
                                <option value="">
                                    Todos
                                </option>

                                <option value="clientes">
                                    Clientes
                                </option>

                                <option value="corretores">
                                    Corretores
                                </option>

                                <option value="admins">
                                    Admins
                                </option>
                            </select>
                        </div>
                    </div>

                    <button id="btn-adicionar-cliente" class="btn-adicionar" type="button">
                        <i class="bi bi-plus-lg"></i>
                        Usuario
                    </button>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>CPF</th>
                            <th>E-mail</th>
                            <th>Telefone</th>
                            <th>Tipo</th> <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaClientes">
                    </tbody>
                </table>

                <div class="rodape-tabela">
                    <span id="textoPaginacao">
                        Mostrando 0 de 0 usuarios
                    </span>

                    <div id="pg" class="paginacao">
                        </div>

                </div>

            </div>

        </section>

    </main>

    <script src="js/menu.js"></script>

    <script src="js/usuarios.js"></script>

</body>
</html>
