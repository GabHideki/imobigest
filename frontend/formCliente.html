<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Usuário</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="form.css">
</head>

<body>

    <div class="modal" id="modalCliente">

        <div class="modal-container" id="modalContainerCliente">

            <button type="button" class="btn-fechar" id="btnFechar" aria-label="Fechar">
                <i class="bi bi-x-lg"></i>
            </button>

            <h1 id="tituloPagina">Cadastro Cliente</h1>
            <hr>

            <form id="formCadastro">

                <div id="containerTipoUsuario"></div>

                <div>
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div>
                    <label for="cpf">CPF</label>
                    <input type="number" id="cpf" name="cpf" required>
                </div>

                <div>
                    <label for="telefone">Telefone</label>
                    <input type="number" id="tell" name="telefone" required>
                </div>

                <div>                
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div id="camposCredenciais" style="display: none;">
                    <div style="margin-top: 15px;">
                        <label for="usuarioLogin">Nome de Usuário (Login)</label>
                        <input type="text" id="usuarioLogin" name="usuarioLogin">
                    </div>
                    <div style="margin-top: 15px;">
                        <label for="senhaLogin">Senha de Acesso</label>
                        <input type="password" id="senhaLogin" name="senhaLogin">
                    </div>
                </div>

                <div class="btn" style="margin-top: 20px;">
                    <button type="button" id="btnCancelar">Cancelar</button>
                    <button type="submit" id="btnCadastrar">Cadastrar</button>
                </div>

                <div id="mensagem-cadastro" style="margin-top: 15px; text-align: center; font-weight: bold;"></div>

            </form>

        </div>

    </div>

    <script src="js/cadastroCliente.js"></script>
</body>
</html>
